<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SuZu DreamToon AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

<nav class="navbar neon-navbar auth-navbar">
  <div class="nav-beam" aria-hidden="true"></div>
  <div class="container">
    <a class="navbar-brand neon-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
      <span class="brand-text"><span class="su">SuZu</span> <span class="dm">DreamToon</span> <span class="ai">AI</span></span>
    </a>
    <div class="neon-nav-actions">
      <a href="index.html" class="btn-nav btn-nav-login">← Home</a>
      <a href="register.html" class="btn-nav btn-nav-signup">Sign Up</a>
    </div>
  </div>
</nav>

<section class="auth-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card">
          <h2>Welcome Back</h2>
          <p class="auth-subtitle">Log in to your AI Cartoon Story Studio</p>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <p class="auth-switch mt-3">
            Don't have an account? <a href="register.html">Sign Up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer><p>© 2026 SuZu DreamToon AI. All Rights Reserved.</p></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
